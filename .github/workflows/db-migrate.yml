name: Apply Supabase Migrations

# Runs BEFORE Vercel deploys, so the DB is always up to date by the time
# the new code is live. Pushes to `staging` migrate the staging DB;
# pushes to `main` migrate the production DB.

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine target project
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ref=vqgzwqrixtesieblrbzy" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "password_secret=PROD_DB_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            echo "ref=snobwvwwgvksbxjpxbhv" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "password_secret=STAGING_DB_PASSWORD" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations to ${{ steps.target.outputs.env }}
        env:
          DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.PROD_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ steps.target.outputs.ref }} --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
